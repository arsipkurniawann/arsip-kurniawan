<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Data Arsip</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="wrapper">

    <aside class="sidebar">
        <h3>Arsip Kurniawan</h3>

        <ul>
            <li onclick="location.href='dashboard.html'">Dashboard</li>
            <li onclick="location.href='arsip.html'">Arsip</li>
            <li onclick="location.href='upload.html'">Upload Arsip</li>
            <li id="menuUser" onclick="location.href='user.html'">Pengguna</li>
            <li onclick="logout()">Logout</li>
        </ul>
    </aside>

    <main class="content">

        <h2 class="mb-3">Data Arsip</h2>

        <div class="card p-3">

            <div class="row mb-3">
                <div class="col-md-6">
                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Cari No Aju, No Daftar, Nama Dokumen, Kategori, Jam In/Out">
                </div>

                <div class="col-md-3">
                    <select id="filterKategori" class="form-select">
                        <option value="">Semua Kategori</option>
                        <option>BC 2.3</option>
                        <option>BC 2.5</option>
                        <option>BC 2.6.1</option>
                        <option>BC 2.6.2</option>
                        <option>BC 2.7</option>
                        <option>BC 3.0</option>
                        <option>BC 4.0</option>
                        <option>BC 4.1</option>
                        <option>Lainnya</option>
                    </select>
                </div>

                <div class="col-md-3 text-end">
                    <button
                        class="btn btn-success"
                        onclick="exportExcel()">
                        Export Excel
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>No Arsip</th>
                            <th>Kategori</th>
                            <th>No Aju</th>
                            <th>No Daftar</th>
                            <th>Nama Dokumen</th>
                            <th>Tanggal</th>
                            <th>Jam In/Out</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="tbodyArsip"></tbody>
                </table>
            </div>

            <!-- Modal Preview -->
            <div class="modal fade" id="previewModal" tabindex="-1">
                <div class="modal-dialog modal-xl">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">Preview Arsip</h5>
                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                            </button>
                        </div>

                        <div class="modal-body">
                            <iframe
                                id="previewFrame"
                                style="width:100%; height:700px; border:none;">
                            </iframe>
                        </div>

                    </div>
                </div>
            </div>

        </div>

    </main>

</div>

<script>
const role = localStorage.getItem("role");

if(role !== "admin"){
    document.getElementById("menuUser").style.display = "none";
}

function logout(){
    localStorage.clear();
    location.href = "../index.html";
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/protect.js"></script>
<script src="../js/db.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="../js/arsip.js"></script>

<script>
setTimeout(loadArsip, 500);
</script>

</body>
</html>
