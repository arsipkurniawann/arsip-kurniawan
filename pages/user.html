<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<title>Pengguna</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>
<body>

<div class="wrapper">

<aside class="sidebar">

<h3>Arsip Kurniawan</h3>

<ul>

<li onclick="location.href='dashboard.html'">
Dashboard
</li>

<li onclick="location.href='arsip.html'">
Arsip
</li>

<li onclick="location.href='upload.html'">
Upload Arsip
</li>

<li onclick="location.href='user.html'">
Pengguna
</li>

<li onclick="logout()">
Logout
</li>

</ul>

</aside>

<main class="content">

<h2>Manajemen Pengguna</h2>

<button
class="btn btn-primary mb-3"
onclick="showTambahUser()">

Tambah User

</button>

<div class="mb-3">

    <button
    onclick="backupDB()"
    class="btn btn-success">
    Backup Database
    </button>

    <input
    type="file"
    id="restoreFile"
    class="form-control mt-2">

    <button
    onclick="restoreDB()"
    class="btn btn-info mt-2">
    Restore Database
    </button>

</div>

<table class="table table-bordered">

<thead>

<tr>

<th>No</th>
<th>Username</th>
<th>Role</th>
<th>Aksi</th>

</tr>

</thead>

<tbody id="userTable">

</tbody>

</table>

</main>

</div>

<script src="../js/protect.js"></script>
<script src="../js/db.js"></script>
<script src="../js/user.js"></script>

</body>
</html>
