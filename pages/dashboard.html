<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="wrapper">

    <aside class="sidebar">

        <h3>Arsip Kurniawan</h3>

        <ul>

            <li onclick="location.href='dashboard.html'">
                Dashboard
            </li>

            <li onclick="location.href='arsip.html'">
                Arsip
            </li>

            <li onclick="location.href='upload.html'">
                Upload Arsip
            </li>

            <li id="menuUser"
                onclick="location.href='user.html'">
                Pengguna
            </li>

            <li onclick="logout()">
                Logout
            </li>

        </ul>

    </aside>

    <main class="content">

        <h2>Dashboard</h2>

        <p id="roleInfo"></p>

        <div class="row mb-4">

            <div class="col-md-3">

                <div class="card stat-card">

                    <h5>Total Arsip</h5>

                    <h2 id="totalArsip">
                        0
                    </h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card stat-card">

                    <h5>Arsip Hari Ini</h5>

                    <h2 id="arsipHariIni">
                        0
                    </h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card stat-card">

                    <h5>Bulan Ini</h5>

                    <h2 id="arsipBulanIni">
                        0
                    </h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card stat-card">

                    <h5>Penyimpanan</h5>

                    <h2 id="storage">
                        0 MB
                    </h2>

                </div>

            </div>

        </div>

        <hr class="my-4">

        <h4>Grafik Arsip</h4>

        <div class="card p-3 mb-4">

            <div class="chart-container">

                <canvas id="arsipChart"></canvas>

            </div>

        </div>

        <h4>Statistik Kategori</h4>

        <div class="row" id="kategoriCards">

        </div>

    </main>

<script>

const role =
localStorage.getItem("role");

const username =
localStorage.getItem("username");

document
.getElementById("roleInfo")
.innerHTML =
"Login sebagai : "
+
username
+
" ("
+
role
+
")";

if(role !== "admin"){

    document
    .getElementById("menuUser")
    .style.display = "none";

}

function logout(){

    localStorage.clear();

    location.href =
    "../index.html";

}

</script>

<script src="../js/protect.js"></script>

<script src="../js/db.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="../js/dashboard.js"></script>

<script>

</script>

</body>
</html>
